```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelTools AI - Image Tools</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <a href="#" class="logo">PixelTools <span>AI</span></a>
</header>

<main>
    <h1>Free Online Image Tools</h1>
    <p class="subtitle">Convert, compress and create PDF from your photos.</p>

    <section class="card">
        <label class="upload" for="imageInput">
            <span class="upload-icon">＋</span>
            <strong>Choose Photos</strong>
            <span>Select multiple images at once</span>
        </label>

        <input id="imageInput" type="file" accept="image/*" multiple>

        <p id="fileInfo">No photos selected</p>
        <div id="previewGrid"></div>

        <div class="settings">
            <label for="format">Image format</label>
            <select id="format">
                <option value="image/jpeg">JPG</option>
                <option value="image/png">PNG</option>
            </select>

            <label for="quality">Image quality</label>
            <select id="quality">
                <option value="0.5">50%</option>
                <option value="0.7">70%</option>
                <option value="0.8" selected>80%</option>
                <option value="0.9">90%</option>
            </select>
        </div>

        <div class="buttons">
            <button id="pdfBtn">Images to PDF</button>
            <button id="convertBtn">Convert Image</button>
            <button id="compressBtn">Compress Image</button>
            <button id="clearBtn">Clear Photos</button>
        </div>

        <p id="status" aria-live="polite">Select photos to start.</p>
    </section>
</main>

<footer>© <span id="year"></span> PixelTools AI</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="script.js"></script>
</body>
</html>
```
